[project]
name = "eurothermlib"
version = "0.1.16"
description = "EurothermLib is a Python library for interfacing with Eurotherm devices."
readme = "README.md"
authors = [
    { name = "thaeber", email = "thomas.haeber@kit.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "click==8.4.2",
    "cloup==3.1.0",
    "grpcio[protobuf]==1.83.0",
    "nidaqmx==1.6.0",
    "numpy==2.5.2",
    "omegaconf==2.3.1",
    "pint==0.25.3",
    "pydantic==2.13.4",
    "pymodbus[serial]==3.15.0",
    "reactivex==5.1.0",
    "rich==15.0.0",
    "tenacity==9.1.4",
    "textual==8.2.8",
    "textual-plotext==1.0.1",
    "xarray==2026.7.0",
]

[project.scripts]
eurotherm = "eurothermlib.cli.cli:cli"

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "bump-my-version>=1.5.1",
    "git-changelog>=2.9.7",
    "grpc-stubs>=1.53.0.6",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pip>=26.2.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "textual-dev>=1.8.0",
    "toolz>=1.1.0",
]

[tool.uv]
python-preference = "only-managed"

[tool.black]
skip-string-normalization = true
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/foo.py    # exclude a file named foo.py in the root of the project
  | service_pb2_grpc.pyi  # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''

[tool.bumpversion]
current_version = "0.1.16"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = true
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '''^version\s*=\s*([\'\"\`])({current_version})\1'''
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/eurothermlib/__init__.py"

[tool.git-changelog]
convention = "angular"
in-place = false
output = "changelog.md"
provider = "github"
sections = "fix,feat,refactor,chore,style,build"
template = "angular"

[tool.ruff.lint]
ignore = ["C408", "DTZ005", "DTZ001"]

[tool.ruff.lint.per-file-ignores]
"service_pb2.py" = ["E501"]
"service_pb2.pyi" = ["E501"]
"service_pb2_grpc.py" = ["E501"]
"service_pb2_grpc.pyi" = ["E501"]
"utils.py" = ["F821"]
